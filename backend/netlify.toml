[build]
  command = "npm install --legacy-peer-deps && npm run build"
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/graphql/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/graphql"
  status = 200